user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    upstream backend {
        server my-oj-backend:8101;
        keepalive 16;
    }

    # ========== HTTP：全部 301 跳转到 HTTPS 主域 ==========
    server {
        listen 80 default_server;
        server_name myoj.space www.myoj.space _;

        # 容器健康检查专用（保持 200）
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Let's Encrypt 证书验证目录
        location ^~ /.well-known/acme-challenge/ {
            alias /var/www/acme/.well-known/acme-challenge/;
            default_type text/plain;
        }

        location / {
            return 301 https://myoj.space$request_uri;
        }
    }

    # ========== HTTPS：www 永久跳转到主域 ==========
    server {
        listen 443 ssl;
        http2 on;
        server_name www.myoj.space;

        ssl_certificate     /etc/nginx/certs/fullchain.cer;
        ssl_certificate_key /etc/nginx/certs/myoj.space.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        return 301 https://myoj.space$request_uri;
    }

    # ========== HTTPS：主站 ==========
    server {
        listen 443 ssl;
        http2 on;
        server_name myoj.space;

        ssl_certificate     /etc/nginx/certs/fullchain.cer;
        ssl_certificate_key /etc/nginx/certs/myoj.space.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # AI 陪练：chat / solution 是 SSE 流式回答，关闭缓冲才能边生成边推送；
        # 回答前可能先整理记忆、提示和看答案也可能较慢，读超时放宽到与后端流式超时一致的 5 分钟
        location ^~ /api/companion/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 75s;
            proxy_read_timeout 300s;
        }

        location ^~ /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location = /favicon.svg {
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        location ~* "\.[0-9a-f]{8}\.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|worker\.js)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
