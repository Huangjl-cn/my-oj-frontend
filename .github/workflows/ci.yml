# 每次 push 和提 PR 都跑一遍：lint、格式、单元测试、类型检查 + 构建
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

# 同一个分支连续 push 时，只跑最新的那次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 格式检查
        run: npx prettier --check "src/**/*.{ts,vue,css}"

      - name: 单元测试
        run: npm run test:unit

      - name: 类型检查和构建
        run: npm run build
